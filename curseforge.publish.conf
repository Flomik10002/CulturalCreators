# Конфиг для scripts/publish-curseforge.sh
# Тут настройки конкретно под Botania Ponder. Логика самого скрипта в publish-curseforge.sh.

# ID проекта на CurseForge. Смотри на странице проекта -> "About Project" в сайдбаре,
# или в урле legacy.curseforge.com/minecraft/mc-mods/<slug> (там ID тоже виден).
# БЕЗ ЭТОГО СКРИПТ НЕ ЗАРАБОТАЕТ.
CF_PROJECT_ID="953832"

# Слаг проекта (то, что в урле после mc-mods/). Нужен только чтобы в конце скрипт
# напечатал прямую ссылку на залитый файл. Можно не заполнять.
CF_PROJECT_SLUG=""

# "owner/repo" на GitHub. Пусто = сам возьмёт из git remote origin.
# Джарник всегда тянется из GitHub Release этого репозитория для публикуемого тега —
# он должен быть прикреплён к релизу заранее (gh release upload <тег> <путь-к-jar>).
CF_GITHUB_REPO=""

# Версия Minecraft и лоадер (Forge/Fabric/...). Пустая строка = скрипт сам их найдёт:
# версию — из gradle.properties (minecraft_version=...), лоадер — по плагину в build.gradle.
# Трогать не нужно, пока автоопределение не выдаст ошибку.
CF_MC_VERSIONS=""
CF_MOD_LOADERS=""

# Обязательная метка CurseForge "Environment" (отдельно от версии MC и лоадера,
# аддон (см. CLAUDE.md), поэтому "Client". Было бы "Server" для серверного мода
# или "Client Server" (через пробел) если нужен на обеих сторонах.
CF_ENVIRONMENTS="Client Server"

# Доп. версии, если нужно отметить что-то ещё на CurseForge (например "Java 17"). Обычно не нужно.
CF_EXTRA_VERSIONS=""

# Тип релиза: release / beta / alpha. Можно переопределить на лету флагом --release-type.
CF_RELEASE_TYPE="release"

# Префикс тега, который отрезается, чтобы получить номер версии (тег v1.1.1 -> версия 1.1.1).
CF_TAG_PREFIX="v"

# Regex-паттерн ассетов релиза, которые надо игнорировать при поиске jar
# (если вдруг прикрепишь к релизу ещё и sources/dev-сборку).
CF_JAR_EXCLUDE_PATTERN="-(sources|dev|shadow|api)\.jar$"

# Откуда брать текст чейнджлога для загрузки. Скрипт ищет заголовок "## <версия>"
# в этом файле и берёт всё до следующего "## ".
CF_CHANGELOG_FILE="CHANGELOG.md"
CF_CHANGELOG_TYPE="markdown"

# Как называть файл на странице CurseForge. {mod_name} и {version} подставляются сами.
CF_DISPLAY_NAME_TEMPLATE="{mod_name}-{version}"
# Название мода для {mod_name} выше. Пусто = возьмётся mod_name из gradle.properties.
CF_MOD_NAME=""

# Файл, куда скрипт пишет какие теги уже опубликованы (чтобы не заливать их повторно).
# Не трогать, он в .gitignore.
CF_STATE_FILE=".curseforge-published.json"
