plugins {
	id 'fabric-loom' version '1.10.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
	// JEI.
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
	// Create, Cultural Delights and Farmer's Delight. The released Create Fabric jar
	// nests Registrate, Porting Lib, Flywheel and Forge Config API Port, so taking it
	// from here keeps the workspace to a single repository instead of the six mavens
	// its POM would otherwise pull from.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

	// The mods the recipes target. Both stay optional at runtime — every recipe
	// carries load conditions and fabric.mod.json only recommends them — but the
	// dev runs need them for the recipes to load at all.
	modImplementation "maven.modrinth:create-fabric:${project.create_version}"
	modImplementation "maven.modrinth:cultural-delights-fabric:${project.cultural_delights_version}"

	// Available in the dev runs for testing, never a hard dependency: the API is
	// compile-only and the full jars only land on the run classpath.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	modCompileOnly "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
	modLocalRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}