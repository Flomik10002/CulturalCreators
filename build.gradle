plugins {
	id 'java'
	id 'maven-publish'
	id 'net.neoforged.moddev.legacyforge' version '2.0.143'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-forge-${project.minecraft_version}"
}

repositories {
	// JEI.
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
	// Create, Cultural Delights and Farmer's Delight, which publish no Forge
	// artifacts anywhere else. Create bundles Flywheel and Registrate in its jar.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

legacyForge {
	version = project.forge_version

	validateAccessTransformers = true

	runs {
		client {
			client()
		}
		server {
			server()
		}
	}

	mods {
		culturalcreators {
			sourceSet sourceSets.main
		}
	}
}

obfuscation {
	// Remapping counterpart of additionalRuntimeClasspath, for mods that should only
	// be present in the dev runs.
	createRemappingConfiguration(configurations.additionalRuntimeClasspath)
}

dependencies {
	// The mods the recipes target. Both stay optional at runtime — every recipe
	// carries a forge:mod_loaded condition and mods.toml marks them mandatory=false —
	// but the dev runs need them for the recipes to load at all. These configurations
	// remap the published SRG jars to the official mappings of the workspace.
	modImplementation "maven.modrinth:create:${project.create_version}"
	modImplementation "maven.modrinth:cultural-delights:${project.cultural_delights_version}"

	// Available in the dev runs for testing, never a hard dependency: the API is
	// compile-only and the full jars only land on the run classpath.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-forge-api:${project.jei_version}"
	modAdditionalRuntimeClasspath "mezz.jei:jei-${project.minecraft_version}-forge:${project.jei_version}"

	modCompileOnly "maven.modrinth:farmers-delight:${project.farmers_delight_version}"
	modAdditionalRuntimeClasspath "maven.modrinth:farmers-delight:${project.farmers_delight_version}"
}

processResources {
	inputs.property "version", project.version
	inputs.property "forge_version_range", project.forge_version_range

	filesMatching("META-INF/mods.toml") {
		expand "version": project.version,
				"forge_version_range": project.forge_version_range
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()

	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}" }
	}
}

publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}
}
