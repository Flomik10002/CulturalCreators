plugins {
	id 'fabric-loom' version '1.10.5'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = "${project.archives_base_name}-fabric-${project.minecraft_version}"
}

repositories {
	// JEI.
	maven {
		name = 'BlameJared'
		url = 'https://maven.blamejared.com/'
	}
	// Create Fabric and Porting Lib.
	maven {
		name = 'Fabricators of Create'
		url = 'https://mvn.devos.one/snapshots'
	}
	maven {
		name = 'Fabricators of Create Releases'
		url = 'https://mvn.devos.one/releases'
	}
	// Registrate.
	maven {
		name = 'tterrag'
		url = 'https://maven.tterrag.com/'
	}
	// Forge Config API Port.
	maven {
		name = 'Fuzs'
		url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
	}
	// Reach Entity Attributes.
	maven {
		name = 'JamiesWhiteShirt'
		url = 'https://maven.jamieswhiteshirt.com/libs-release'
	}
	// Cloth Config.
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
	// Fabric-ASM, which Farmer's Delight needs and which is published nowhere else.
	maven {
		name = 'JitPack'
		url = 'https://jitpack.io'
		content {
			includeGroup 'com.github.Chocohead'
		}
	}
	// Cultural Delights and Farmer's Delight.
	maven {
		name = 'Modrinth'
		url = 'https://api.modrinth.com/maven'
		content {
			includeGroup 'maven.modrinth'
		}
	}
}

// The Fabric build of Flywheel is published to no repository at all and exists only
// nested inside the released Create jar, while Fabric Loader ignores nested jars in a
// development run. Pull that one file out and hand it to the run directly.
def flywheelJar = layout.buildDirectory.file("create-flywheel/${project.create_version}/flywheel.jar").get().asFile
if (!flywheelJar.exists()) {
	flywheelJar.parentFile.mkdirs()
	def createJar = configurations.detachedConfiguration(
			dependencies.create("maven.modrinth:create-fabric:${project.create_version}")).singleFile
	new java.util.zip.ZipFile(createJar).withCloseable { zip ->
		def entry = zip.entries().collect().find { it.name ==~ 'META-INF/jars/flywheel-fabric-.*\\.jar' }
		flywheelJar.withOutputStream { out ->
			zip.getInputStream(entry).withCloseable { it.transferTo(out) }
		}
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
	
	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"

	// The mods the recipes target. Both stay optional at runtime — every recipe carries
	// load conditions and fabric.mod.json only recommends them — but the dev runs need
	// them for the recipes to load at all.
	modImplementation("com.simibubi.create:create-fabric-${project.minecraft_version}:${project.create_version}") {
		exclude group: 'com.jozufozu.flywheel'
	}
	modLocalRuntime files(flywheelJar)
	modImplementation "maven.modrinth:cultural-delights-fabric:${project.cultural_delights_version}"

	// Available in the dev runs for testing, never a hard dependency: the API is
	// compile-only and the full jars only land on the run classpath.
	modCompileOnly "mezz.jei:jei-${project.minecraft_version}-fabric-api:${project.jei_version}"
	modLocalRuntime "mezz.jei:jei-${project.minecraft_version}-fabric:${project.jei_version}"

	// Farmer's Delight is only published to Modrinth, which records no dependencies, so
	// the mods its jar nests have to be named here or the run starts without them.
	modCompileOnly "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
	modLocalRuntime "maven.modrinth:farmers-delight-refabricated:${project.farmers_delight_version}"
	modLocalRuntime "com.github.Chocohead:Fabric-ASM:${project.fabric_asm_version}"
	['config', 'lazy_registration', 'loot', 'recipe_book_categories'].each {
		modLocalRuntime "io.github.fabricators_of_create.Porting-Lib:${it}:${project.porting_lib_version}"
	}
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		mavenJava(MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}